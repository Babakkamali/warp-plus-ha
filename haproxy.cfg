global
    log 127.0.0.1 local0
    external-check
    insecure-fork-wanted
    maxconn 4096
    tune.ssl.default-dh-param 2048

defaults
    log global
    mode tcp  # TCP mode for socks5 proxy
    option tcplog
    option redispatch
    retries 3
    timeout connect 5s
    timeout client  30s
    timeout server  30s

# Frontend for gool socks5 proxy
frontend gool_frontend
    bind *:1080
    mode tcp
    default_backend warp_plus_gool

# Frontend for psiphon socks5 proxy
frontend psiphon_frontend
    bind *:1081
    mode tcp
    default_backend warp_plus_psiphon

# Backend with load balancing and health checks
backend warp_plus_gool
    mode tcp
    balance leastconn
    option external-check
    external-check command /usr/local/etc/haproxy/haproxy_healthcheck.sh
    server warp_plus-1 gool-1:8086 check
    server warp_plus-2 gool-2:8086 check
    server warp_plus-3 gool-3:8086 check

backend warp_plus_psiphon
    mode tcp
    balance leastconn
    option external-check
    external-check command /usr/local/etc/haproxy/haproxy_healthcheck.sh
    server warp_plus-1 psiphon-1:8086 check
    server warp_plus-2 psiphon-2:8086 check
    server warp_plus-3 psiphon-3:8086 check